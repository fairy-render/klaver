[package]
name = "klaver-wintertc"
version = "0.2.0"
edition = "2024"

[features]
default = ["module"]
full = [
    "fetch",
    "timers",
    "crypto",
    "crypto-cipher",
    "crypto-asymmetric",
    "intl",
    "streams",
    "worker",
]
fetch = [
    "bytes",
    "http",
    "http-body",
    "http-body-util",
    "serde_json",
    "url",
    "form_urlencoded",
    "urlencoding",
    "multer",
    "streams",
]
timers = []
crypto = ["rand", "uuid", "sha1", "sha2"]
crypto-cipher = ["crypto", "aes", "aes-gcm", "cbc", "hmac"]
crypto-asymmetric = ["crypto-cipher", "rsa", "rsa-sha1", "p256", "p384", "p521", "hkdf", "pbkdf2"]
intl = [
    "icu",
    "icu_provider",
    "localzone",
    "chrono-tz",
    "chrono",
    "sys-locale",
    "fixed_decimal",
    "klaver-core/chrono",
]
intl-baked = ["intl", "icu/compiled_data"]
streams = ["async-trait", "async-stream"]
worker = ["klaver-vm"]
fs = ["vfs", "mime_guess", "relative-path"]
module = ["klaver-modules"]

tokio = ["reqwest", "dep:tokio", "timers", "fetch", "fs", "vfs-tokio", "klaver-vm?/tokio"]
compio = ["dep:compio", "dep:cyper", "fetch", "timers", "fs", "vfs-compio", "klaver-vm?/compio"]

[dependencies]
rquickjs = { workspace = true }
klaver-core = { path = "../klaver-core" }
klaver-runtime = { path = "../klaver-runtime" }
klaver-modules = { path = "../klaver-modules", optional = true }


futures.workspace = true
pin-project-lite = { version = "0.2" }
flume.workspace = true

serde = { version = "1", features = ["derive"], optional = true }

## Worker
klaver-vm = { path = "../klaver-vm", features = ["worker"], optional = true }


## Encoding
encoding_rs = { version = "0.8" }
base64 = { version = "0.22" }

## Fetch
bytes = { version = "1", optional = true }
http = { version = "1", optional = true }
http-body = { version = "1", optional = true }
http-body-util = { version = "0.1", optional = true }
serde_json = { version = "1", optional = true }
url = { version = "2", optional = true }
form_urlencoded = { version = "1", optional = true }
urlencoding = { version = "2", optional = true }
multer = { version = "3", optional = true }


## Crypto
rand = { version = "0.10", optional = true }
uuid = { version = "1", features = ["v4"], optional = true }
sha1 = { version = "0.11", optional = true }
sha2 = { version = "0.11", optional = true }

## Crypto (cipher/key-management, gated separately behind `crypto-cipher`)
aes = { version = "0.9", optional = true }
aes-gcm = { version = "0.11", default-features = false, features = [
    "aes",
    "alloc",
], optional = true }
cbc = { version = "0.2", features = ["alloc"], optional = true }
hmac = { version = "0.13", optional = true }

## Crypto (asymmetric, gated separately behind `crypto-asymmetric`). Deliberately does NOT add its
## own `pkcs8`/`spki`/`signature` dependency edges: `rsa` 0.9 depends on the 0.10/0.7/2.x line of
## those crates while `p256`/`p384` 0.14 depend on the 0.11/0.8/3.x line, so all DER/signature-trait
## code goes through each crate's own re-export (`rsa::pkcs8`, `p256::ecdsa::signature`, etc.)
## rather than risking a version mismatch against a separately-pinned direct dependency.
## `sha2` enables `rsa::sha2` (needed by `Oaep::new::<D>()` - PKCS#1 v1.5 sign/verify avoids this
## entirely by constructing `Pkcs1v15Sign` from its own public `hash_len`/`prefix` fields directly,
## hashing via this crate's own `digest.rs` instead). `getrandom` enables `rsa::rand_core::OsRng` -
## `rsa`'s `CryptoRngCore` bound is rand_core 0.6, a different major version than the `rand = "0.10"`
## (rand_core 0.10) used everywhere else in this crate (including by `p256`/`p384` below), so RSA
## operations always go through `rsa::rand_core::OsRng`, never `rand::rng()`.
rsa = { version = "0.9", features = ["sha2", "getrandom"], optional = true }
## `rsa` re-exports its own `sha2` (matching its internal digest 0.10 line) but never re-exports a
## `sha1`, even though it depends on one internally - so OAEP/PSS SHA-1 support needs a second,
## separately-named `sha1` pinned to that same digest 0.10 line (independent of this crate's own
## `sha1 = "0.11"` above, a different major version of the `digest` trait and not usable as
## `Oaep`/`Pss`'s `D: Digest` type parameter - see `rsa.rs`'s doc comment).
rsa-sha1 = { package = "sha1", version = "0.10", optional = true }
## `ecdsa`/`pkcs8` are already on by default; `ecdh` (for `SecretKey::diffie_hellman`) is not.
p256 = { version = "0.14", features = ["ecdh"], optional = true }
p384 = { version = "0.14", features = ["ecdh"], optional = true }
p521 = { version = "0.14", features = ["ecdh"], optional = true }
## `hkdf`/`pbkdf2` are pure key-derivation functions (no asymmetric key material involved), but
## `deriveBits`/`deriveKey` and the `DeriveBitsAlgorithm` parsing they share with ECDH are only
## wired up behind `crypto-asymmetric` (see `module.rs`), so both live here rather than under the
## plain `crypto-cipher` gate. Both depend on the exact same `hmac = "0.13"`/`sha2 = "0.11"` line
## already used elsewhere in this crate (unlike `rsa`'s isolated dependency tree above), so no
## extra re-export indirection is needed - `hkdf::Hkdf<Sha256>`/`pbkdf2::pbkdf2_hmac::<Sha256>` are
## called directly with this crate's own `sha1`/`sha2` types.
hkdf = { version = "0.13", optional = true }
pbkdf2 = { version = "0.13", optional = true }

## Intl
icu = { version = "1.5.0", default-features = false, features = [
    "experimental",
    "std",
], optional = true }
icu_provider = { version = "1.5.0", optional = true }
localzone = { version = "0.3", optional = true }
chrono-tz = { version = "0.10", optional = true }
chrono = { version = "0.4", optional = true }
sys-locale = { version = "0.3", optional = true }
fixed_decimal = { version = "0.5", features = ["ryu"], optional = true }


## Streams
async-trait = { version = "0.1", optional = true }
async-stream = { version = "0.3", optional = true }

## FS
vfs = { git = "https://github.com/kildevaeld/vfs-rs", features = [
    "std",
], optional = true }
vfs-tokio = { git = "https://github.com/kildevaeld/vfs-rs", optional = true }
vfs-compio = { git = "https://github.com/kildevaeld/vfs-rs", optional = true }
relative-path = { version = "2", optional = true }

mime_guess = { version = "2", optional = true }

## Backend
tokio = { version = "1", features = ["time"], optional = true }
reqwest = { version = "0.13", optional = true }

compio = { version = "0.19", features = ["time"], optional = true }
cyper = { version = "0.9", features = ["stream"], optional = true }

[dev-dependencies]
klaver-vm = { path = "../klaver-vm" }
tokio = { version = "1", features = ["rt", "macros"] }
